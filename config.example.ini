# ===========================================================================
# arXiv 每日论文邮件配置（示例文件）
# 复制为 config.ini 后填写。云端 GitHub Actions 运行时改用 Secrets 注入，
# 不需要提交 config.ini。
# ===========================================================================

[smtp]
# 126 邮箱：smtp.126.com / 465 (SSL)
# 163 邮箱：smtp.163.com / 465 (SSL)
# QQ 邮箱： smtp.qq.com  / 465 (SSL)
host = smtp.126.com
port = 465

# 发件邮箱地址（完整地址，例如 xxxx@126.com）
user =

# SMTP 授权码（不是邮箱登录密码！）
# 126 邮箱获取方法：登录网页版 → 设置 → POP3/SMTP/IMAP → 开启 SMTP 服务 → 新增授权密码
auth_code =

# 邮件里显示的发件人名称
from_name = arXiv 论文日报

[mail]
# 收件邮箱，多个用英文逗号分隔
to =

[arxiv]
# 论文分类，多个用逗号分隔，例如：cs.CL, cs.AI, cs.LG
categories = cs.CL

# 每天发送多少篇
max_papers = 50

# 每次从 arXiv 拉取多少条用于去重（要大于 max_papers）
lookback_fetch = 200

# 网络请求超时（秒）
request_timeout = 60

# 数据来源：auto = 先 API，失败自动转网页；api = 只用 API；html = 只用网页
source = auto

[app]
# 当天没有新论文时：
#   skip         = 不发送（推荐，避免重复推送）
#   resend       = 重发最新 max_papers 篇
on_no_new = skip
