name: arXiv Daily Digest

on:
  schedule:
    # 北京时间 09:05 / 09:45 / 10:25（UTC = 01:05 / 01:45 / 02:25）
    # 三个时间点兜底：GitHub 偶发漏触发 cron；脚本内部保证同一天只发一封
    - cron: "5 1 * * *"
    - cron: "45 1 * * *"
    - cron: "25 2 * * *"
    # 临时测试：北京时间 12:00 / 12:10 / 12:20
    - cron: "0 4 * * *"
    - cron: "10 4 * * *"
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        default: test-email
        options:
          - send
          - test-email
          - dry-run

permissions:
  contents: write

concurrency:
  group: arxiv-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        env:
          ARXIV_SMTP_USER: ${{ secrets.ARXIV_SMTP_USER }}
          ARXIV_SMTP_AUTH_CODE: ${{ secrets.ARXIV_SMTP_AUTH_CODE }}
          ARXIV_MAIL_TO: ${{ secrets.ARXIV_MAIL_TO }}
        run: |
          for v in ARXIV_SMTP_USER ARXIV_SMTP_AUTH_CODE ARXIV_MAIL_TO; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set"
              exit 1
            fi
          done

      - name: Send digest
        env:
          ARXIV_SMTP_HOST: smtp.126.com
          ARXIV_SMTP_PORT: "465"
          ARXIV_SMTP_USER: ${{ secrets.ARXIV_SMTP_USER }}
          ARXIV_SMTP_AUTH_CODE: ${{ secrets.ARXIV_SMTP_AUTH_CODE }}
          ARXIV_MAIL_TO: ${{ secrets.ARXIV_MAIL_TO }}
          ARXIV_CATEGORIES: cs.CL
          ARXIV_MAX_PAPERS: "50"
          ARXIV_LOOKBACK_FETCH: "100"
          ARXIV_SOURCE: "html"
          ARXIV_REQUEST_TIMEOUT: "45"
          ARXIV_CONTACT_EMAIL: xyfhw2017@126.com
        run: |
          case "${{ inputs.mode }}" in
            test-email) python arxiv_daily.py --test-email ;;
            dry-run)    python arxiv_daily.py --dry-run ;;
            *)          python arxiv_daily.py ;;
          esac

      - name: Persist seen state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen papers [skip ci]"
            git push
          fi
